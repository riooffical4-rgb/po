        body {

        }
        
        .font-mono { font-family: 'Courier Prime', monospace; }
        
        /* Styling Foto Profil Lebih Feminin */
        .profile-photo {

            max-height: 550px;

            border-radius: 2rem !important; /* Lebih membulat */

            border: 6px solid #ffffff !important;
            box-shadow:

        }

            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.25);
        }

        /* Tombol Pill (Bulat Telur) */
        .btn-primary-custom { 
            background: linear-gradient(135deg, var(--primary-pink) 0%, #e91e63 100%);
            border: none; 
            padding: 0.8rem 2.5rem; 
            font-weight: 600; 
            border-radius: 50px; /* Pill shape */
            transition: all 0.3s ease;
            color: white;
            letter-spacing: 0.5px;
        }
        .btn-primary-custom:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
            color: white;
        }

        .btn-outline-custom { 
            border: 2px solid var(--primary-pink);

            padding: 0.7rem 2.3rem; 
            font-weight: 600; 
            border-radius: 50px;
            background: transparent;

            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;

            color: var(--primary-pink);
            border-radius: 50px; /* Pill shape */
